<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Decentralized Web3 Profile - Celo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="text-gray-100">
    <!-- Navbar -->
    <nav class="bg-teal-600 shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="text-2xl font-bold text-white">🌐 Web3 Profile</div>
                <div class="flex gap-4 items-center">
                    <button onclick="showSection('home')" class="px-4 py-2 text-white hover:bg-teal-700 rounded transition">Home</button>
                    <button onclick="showSection('edit')" class="px-4 py-2 text-white hover:bg-teal-700 rounded transition">Edit Profile</button>
                    <button onclick="showSection('view')" class="px-4 py-2 text-white hover:bg-teal-700 rounded transition">View Profile</button>
                    <button id="connectBtn" onclick="connectWallet()" class="px-6 py-2 bg-white text-teal-600 font-semibold rounded-lg hover:bg-gray-100 transition shadow-md">
                        Connect Wallet
                    </button>
                    <span id="userAddress" class="text-sm bg-teal-800 px-3 py-1 rounded hidden"></span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mx-auto px-4 py-8">
        <!-- Home Section -->
        <div id="homeSection" class="section">
            <div class="max-w-4xl mx-auto text-center">
                <h1 class="text-5xl font-bold mb-6 text-teal-400">Welcome to Decentralized Profile</h1>
                <p class="text-xl mb-8 text-gray-300">Create and manage your professional identity on the Celo blockchain</p>
                <div class="bg-gray-800 rounded-lg p-8 shadow-xl">
                    <h2 class="text-2xl font-semibold mb-4 text-teal-300">Search for a Profile</h2>
                    <div class="flex gap-2">
                        <input 
                            type="text" 
                            id="searchAddress" 
                            placeholder="Enter Ethereum Address (0x...)"
                            class="flex-1 px-4 py-3 bg-gray-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
                        />
                        <button 
                            onclick="searchProfile()" 
                            class="px-6 py-3 bg-teal-600 text-white font-semibold rounded-lg hover:bg-teal-700 transition">
                            Search
                        </button>
                    </div>
                    <div id="searchResult" class="mt-6"></div>
                </div>
            </div>
        </div>

        <!-- Edit Profile Section -->
        <div id="editSection" class="section hidden">
            <div class="max-w-2xl mx-auto">
                <div class="bg-gray-800 rounded-lg p-8 shadow-xl">
                    <h2 class="text-3xl font-bold mb-6 text-teal-400">Edit Your Profile</h2>
                    <form onsubmit="saveProfile(event)" class="space-y-6">
                        <div>
                            <label class="block text-sm font-medium mb-2 text-gray-300">Name</label>
                            <input 
                                type="text" 
                                id="profileName" 
                                required
                                class="w-full px-4 py-3 bg-gray-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
                                placeholder="Your full name"
                            />
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2 text-gray-300">Bio</label>
                            <textarea 
                                id="profileBio" 
                                required
                                rows="4"
                                class="w-full px-4 py-3 bg-gray-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
                                placeholder="Tell us about yourself..."
                            ></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2 text-gray-300">Portfolio URL</label>
                            <input 
                                type="url" 
                                id="profileUrl" 
                                required
                                class="w-full px-4 py-3 bg-gray-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
                                placeholder="https://your-portfolio.com"
                            />
                        </div>
                        <button 
                            type="submit" 
                            class="w-full px-6 py-3 bg-teal-600 text-white font-semibold rounded-lg hover:bg-teal-700 transition shadow-lg">
                            Save Profile to Blockchain
                        </button>
                    </form>
                    <div id="editStatus" class="mt-4 text-center"></div>
                </div>
            </div>
        </div>

        <!-- View Profile Section -->
        <div id="viewSection" class="section hidden">
            <div class="max-w-2xl mx-auto">
                <div class="bg-gray-800 rounded-lg p-8 shadow-xl">
                    <h2 class="text-3xl font-bold mb-6 text-teal-400">Your Profile</h2>
                    <div id="profileDisplay" class="space-y-4">
                        <p class="text-gray-400">Loading your profile...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================= CONFIG =================
        const CONTRACT_ADDRESS = "0x4de9ae606d49E533a1a8365d667bC524967ebc4C"; // deployed contract (provided)
        const CONTRACT_ABI = [
            {
                "inputs": [
                    {"internalType": "string", "name": "_name", "type": "string"},
                    {"internalType": "string", "name": "_bio", "type": "string"},
                    {"internalType": "string", "name": "_portfolioUrl", "type": "string"}
                ],
                "name": "setProfile",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [{"internalType": "address", "name": "user", "type": "address"}],
                "name": "getProfile",
                "outputs": [
                    {"internalType": "string", "name": "", "type": "string"},
                    {"internalType": "string", "name": "", "type": "string"},
                    {"internalType": "string", "name": "", "type": "string"},
                    {"internalType": "bool", "name": "", "type": "bool"}
                ],
                "stateMutability": "view",
                "type": "function"
            }
        ];

        // Celo Mainnet configuration
        const CELO_MAINNET = {
            chainId: '0xa4ec', // using lowercase hex to compare reliably
            chainName: 'Celo Mainnet',
            nativeCurrency: {
                name: 'CELO',
                symbol: 'CELO',
                decimals: 18
            },
            rpcUrls: ['https://forno.celo.org'],
            blockExplorerUrls: ['https://explorer.celo.org']
        };

        let provider, signer, contract, userAccount;

        // =============== UI helpers ===============
        function setConnectUI(addr) {
            const btn = document.getElementById('connectBtn');
            btn.textContent = `${addr.slice(0,6)}...${addr.slice(-4)}`;
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            const addressDisplay = document.getElementById('userAddress');
            addressDisplay.textContent = `${addr.slice(0,6)}...${addr.slice(-4)}`;
            addressDisplay.classList.remove('hidden');
        }

        // =============== Wallet connect ===============
        async function connectWallet() {
            try {
                if (typeof window.ethereum === 'undefined') {
                    alert('MetaMask is not installed! Please install it to use this DApp.');
                    return;
                }

                // Request account access
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAccount = accounts[0];

                // Get current chainId and normalize
                const chainId = (await window.ethereum.request({ method: 'eth_chainId' }) || '').toLowerCase();

                // If not on Celo Mainnet, request switch
                if (chainId !== CELO_MAINNET.chainId.toLowerCase()) {
                    try {
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: CELO_MAINNET.chainId }],
                        });
                    } catch (switchError) {
                        // If chain not added, add it
                        if (switchError.code === 4902) {
                            try {
                                await window.ethereum.request({
                                    method: 'wallet_addEthereumChain',
                                    params: [CELO_MAINNET],
                                });
                                // After adding, prompt user to switch by re-calling connect
                                alert('Celo Mainnet added to MetaMask. Please click Connect Wallet again and approve the network switch.');
                                return;
                            } catch (addError) {
                                console.error('Failed to add Celo:', addError);
                                alert('Failed to add Celo network to MetaMask.');
                                return;
                            }
                        } else {
                            console.error('Switch error:', switchError);
                            alert('Failed to switch network in MetaMask.');
                            return;
                        }
                    }
                }

                // Initialize ethers provider, signer, contract
                provider = new ethers.providers.Web3Provider(window.ethereum);
                signer = provider.getSigner();
                contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                setConnectUI(userAccount);
                console.log('Connected to Celo Mainnet:', userAccount);

                // If view page showing, load profile
                if (!document.getElementById('viewSection').classList.contains('hidden')) {
                    displayUserProfile();
                }
            } catch (error) {
                console.error('Connection error:', error);
                alert('Failed to connect wallet: ' + (error.message || error));
            }
        }

        // =============== Save profile ===============
        async function saveProfile(e) {
            e.preventDefault();
            if (!contract) {
                alert('Please connect your wallet first!');
                return;
            }

            const name = document.getElementById('profileName').value;
            const bio = document.getElementById('profileBio').value;
            const url = document.getElementById('profileUrl').value;

            const statusDiv = document.getElementById('editStatus');
            statusDiv.innerHTML = '<p class="text-yellow-400">⏳ Saving to blockchain...</p>';

            try {
                const tx = await contract.setProfile(name, bio, url);
                statusDiv.innerHTML = '<p class="text-blue-400">⏳ Transaction submitted. Waiting for confirmation...</p>';
                await tx.wait();
                statusDiv.innerHTML = '<p class="text-green-400">✅ Profile saved successfully!</p>';
                setTimeout(() => statusDiv.innerHTML = '', 4500);
            } catch (error) {
                console.error('Save error:', error);
                statusDiv.innerHTML = `<p class="text-red-400">❌ Error: ${error.message || error}</p>`;
            }
        }

        // =============== Load profile ===============
        async function loadProfile(address) {
            if (!contract) {
                return { exists: false };
            }
            try {
                const result = await contract.getProfile(address);
                return {
                    name: result[0],
                    bio: result[1],
                    portfolioUrl: result[2],
                    exists: result[3]
                };
            } catch (error) {
                console.error('Load profile error', error);
                return { exists: false };
            }
        }

        // =============== Display profile ===============
        async function displayUserProfile() {
            if (!userAccount || !contract) {
                document.getElementById('profileDisplay').innerHTML =
                    '<p class="text-red-400">Please connect your wallet first.</p>';
                return;
            }
            const profile = await loadProfile(userAccount);
            const displayDiv = document.getElementById('profileDisplay');

            if (profile.exists) {
                displayDiv.innerHTML = `
                    <div class="space-y-4">
                        <div class="border-b border-gray-700 pb-4">
                            <h3 class="text-xl font-semibold text-teal-300 mb-2">Name</h3>
                            <p class="text-white">${profile.name}</p>
                        </div>
                        <div class="border-b border-gray-700 pb-4">
                            <h3 class="text-xl font-semibold text-teal-300 mb-2">Bio</h3>
                            <p class="text-white">${profile.bio}</p>
                        </div>
                        <div class="border-b border-gray-700 pb-4">
                            <h3 class="text-xl font-semibold text-teal-300 mb-2">Portfolio</h3>
                            <a href="${profile.portfolioUrl}" target="_blank" class="text-teal-400 hover:text-teal-300 underline">
                                ${profile.portfolioUrl}
                            </a>
                        </div>
                    </div>
                `;
            } else {
                displayDiv.innerHTML = '<p class="text-yellow-400">No profile found. Create one in the Edit Profile section!</p>';
            }
        }

        // =============== Search profile ===============
        async function searchProfile() {
            const address = document.getElementById('searchAddress').value.trim();
            const resultDiv = document.getElementById('searchResult');

            if (!address || !ethers.utils.isAddress(address)) {
                resultDiv.innerHTML = '<p class="text-red-400">Please enter a valid Ethereum address.</p>';
                return;
            }

            if (!contract) {
                resultDiv.innerHTML = '<p class="text-red-400">Please connect your wallet first.</p>';
                return;
            }

            resultDiv.innerHTML = '<p class="text-yellow-400">Searching...</p>';
            const profile = await loadProfile(address);

            if (profile.exists) {
                resultDiv.innerHTML = `
                    <div class="bg-gray-700 rounded-lg p-6 text-left space-y-3">
                        <h3 class="text-2xl font-bold text-teal-300">${profile.name}</h3>
                        <p class="text-gray-300"><strong class="text-teal-400">Address:</strong> ${address}</p>
                        <p class="text-gray-300"><strong class="text-teal-400">Bio:</strong> ${profile.bio}</p>
                        <p class="text-gray-300">
                            <strong class="text-teal-400">Portfolio:</strong> 
                            <a href="${profile.portfolioUrl}" target="_blank" class="text-teal-400 hover:text-teal-300 underline ml-2">
                                ${profile.portfolioUrl}
                            </a>
                        </p>
                    </div>
                `;
            } else {
                resultDiv.innerHTML = '<p class="text-yellow-400">No profile found for this address.</p>';
            }
        }

        // =============== Navigation ===============
        function showSection(section) {
            document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
            
            if (section === 'home') {
                document.getElementById('homeSection').classList.remove('hidden');
            } else if (section === 'edit') {
                document.getElementById('editSection').classList.remove('hidden');
            } else if (section === 'view') {
                document.getElementById('viewSection').classList.remove('hidden');
                displayUserProfile();
            }
        }

        // =============== Handlers ===============
        if (window.ethereum) {
            window.ethereum.on('accountsChanged', (accounts) => {
                if (accounts.length > 0) {
                    location.reload();
                } else {
                    // no accounts - reset UI
                    userAccount = null;
                    document.getElementById('connectBtn').textContent = 'Connect Wallet';
                    document.getElementById('userAddress').classList.add('hidden');
                }
            });

            window.ethereum.on('chainChanged', () => {
                location.reload();
            });
        }

        // init
        showSection('home');
    </script>
</body>
</html>
