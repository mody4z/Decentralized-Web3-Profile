<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Decentralized Web3 Profile - Celo</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Robust ethers loader with fallbacks (guarantees ethers before app runs) -->
  <script>
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.async = true;
        s.onload = () => resolve(src);
        s.onerror = () => reject(new Error('Failed to load ' + src));
        document.head.appendChild(s);
      });
    }

    (async function ensureEthers() {
      if (window.ethers) return;
      const candidates = [
        'https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js',
        'https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js',
        'https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js'
      ];
      for (const url of candidates) {
        try {
          await loadScript(url);
          if (window.ethers) return;
        } catch (e) {
          console.warn('ethers CDN failed:', url, e);
        }
      }
      console.error('All ethers CDN attempts failed');
      alert('Critical: failed to load ethers.js. Please check network / CDN blocking.');
    })();
  </script>

  <style>
    body {
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color: #e6f6f5;
    }
    .btn-primary { background: linear-gradient(90deg,#06b6d4,#0ea5a4); }
    .btn-primary:hover { transform: scale(1.02); }
    .panel { background: rgba(17,24,39,0.65); border-radius: 12px; }
    #statusMessage { max-width: 420px; right: 20px; bottom: 20px; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="bg-teal-600 shadow-lg">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <div class="text-2xl font-bold text-white">🌐 Web3 Profile</div>
      <div class="flex items-center gap-3">
        <button id="btnHome" class="px-3 py-2 text-white hover:bg-teal-700 rounded">Home</button>
        <button id="btnEdit" class="px-3 py-2 text-white hover:bg-teal-700 rounded">Edit Profile</button>
        <button id="btnView" class="px-3 py-2 text-white hover:bg-teal-700 rounded">View Profile</button>
        <button id="connectBtn" class="px-4 py-2 bg-white text-teal-600 font-semibold rounded-lg shadow">Connect Wallet</button>
        <span id="userAddress" class="text-sm bg-teal-800 px-3 py-1 rounded hidden text-white"></span>
      </div>
    </div>
  </nav>

  <!-- Main -->
  <main class="container mx-auto px-4 py-8">
    <!-- Home -->
    <section id="homeSection" class="section">
      <div class="max-w-4xl mx-auto text-center">
        <h1 class="text-4xl font-bold mb-4 text-teal-300">Decentralized Profile (Celo)</h1>
        <p class="text-lg text-gray-300 mb-6">Create and manage your professional identity on the Celo blockchain.</p>

        <div class="panel p-6">
          <h2 class="text-2xl font-semibold text-teal-200 mb-4">Search for a Profile</h2>
          <div class="flex gap-2">
            <input id="searchAddress" type="text" placeholder="Enter address (0x...)" class="flex-1 px-4 py-3 bg-gray-700 rounded focus:outline-none"/>
            <button id="searchBtn" class="px-5 py-3 btn-primary rounded text-white font-semibold">Search</button>
          </div>
          <div id="searchResult" class="mt-4"></div>
        </div>
      </div>
    </section>

    <!-- Edit -->
    <section id="editSection" class="section hidden mt-8">
      <div class="max-w-2xl mx-auto">
        <div class="panel p-6 shadow-lg">
          <h2 class="text-2xl font-bold text-teal-200 mb-4">Edit Your Profile</h2>
          <form id="profileForm" class="space-y-4">
            <input id="profileName" placeholder="Full name" required class="w-full px-4 py-3 bg-gray-800 rounded"/>
            <textarea id="profileBio" placeholder="Short bio" rows="4" required class="w-full px-4 py-3 bg-gray-800 rounded"></textarea>
            <input id="profileUrl" placeholder="Portfolio URL" type="url" required class="w-full px-4 py-3 bg-gray-800 rounded"/>
            <button type="submit" id="saveProfileBtn" class="w-full btn-primary py-3 rounded text-white font-semibold">Save Profile to Blockchain</button>
            <div id="editStatus" class="mt-3 text-center"></div>
          </form>
        </div>
      </div>
    </section>

    <!-- View -->
    <section id="viewSection" class="section hidden mt-8">
      <div class="max-w-2xl mx-auto">
        <div class="panel p-6 shadow-lg">
          <h2 class="text-2xl font-bold text-teal-200 mb-4">Profile</h2>
          <div id="profileDisplay" class="text-gray-200">Connect wallet and view your profile here.</div>
        </div>
      </div>
    </section>
  </main>

  <!-- Status -->
  <div id="statusMessage" class="fixed bottom-6 right-6 hidden p-4 rounded shadow bg-white text-slate-800">
    <div id="statusText"></div>
  </div>

  <!-- App script (waits for ethers then initializes) -->
  <script>
    (function waitForEthersAndInit() {
      const timeout = 6000;
      const start = Date.now();
      (function check() {
        if (typeof window.ethers !== 'undefined') return initApp();
        if (Date.now() - start < timeout) return setTimeout(check, 100);
        console.error('ethers.js not loaded');
        alert('Critical: ethers.js failed to load. Please check network / CDN blocking.');
      })();
    })();

    function initApp() {
      // CONFIG
      const CONTRACT_ADDRESS = "0x4de9ae606d49E533a1a8365d667bC524967ebc4C";
      const CONTRACT_ABI = [
        {"inputs":[{"internalType":"string","name":"_name","type":"string"},{"internalType":"string","name":"_bio","type":"string"},{"internalType":"string","name":"_portfolioUrl","type":"string"}],"name":"setProfile","outputs":[],"stateMutability":"nonpayable","type":"function"},
        {"inputs":[{"internalType":"address","name":"user","type":"address"}],"name":"getProfile","outputs":[{"internalType":"string","name":"","type":"string"},{"internalType":"string","name":"","type":"string"},{"internalType":"string","name":"","type":"string"},{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"}
      ];
      const CELO_MAINNET = { chainId: '0xa4ec', chainName: 'Celo Mainnet', nativeCurrency:{name:'CELO',symbol:'CELO',decimals:18}, rpcUrls:['https://forno.celo.org'], blockExplorerUrls:['https://explorer.celo.org'] };

      let provider = null;
      let signer = null;
      let contract = null;
      let userAccount = null;

      // UI helpers
      const statusEl = document.getElementById('statusMessage');
      const statusText = document.getElementById('statusText');
      function showStatus(msg, type='info', ttl=4000) {
        statusText.textContent = msg;
        statusEl.classList.remove('hidden', 'bg-blue-100', 'bg-green-100', 'bg-red-100');
        statusEl.classList.add(type === 'success' ? 'bg-green-100' : type === 'error' ? 'bg-red-100' : 'bg-blue-100');
        clearTimeout(window._statusTimer);
        window._statusTimer = setTimeout(() => statusEl.classList.add('hidden'), ttl);
      }

      function showSection(section) {
        document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
        if (section === 'home') document.getElementById('homeSection').classList.remove('hidden');
        if (section === 'edit') document.getElementById('editSection').classList.remove('hidden');
        if (section === 'view') {
          document.getElementById('viewSection').classList.remove('hidden');
          displayUserProfile();
        }
      }

      // DIRECT MetaMask connect (exact behavior like Skill-NFT)
      async function connectWallet() {
        try {
          if (!window.ethereum) {
            showStatus('No injected wallet found. Please install MetaMask.', 'error', 6000);
            return;
          }
          showStatus('Requesting wallet connection...', 'info');
          const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
          if (!accounts || accounts.length === 0) throw new Error('No accounts');
          userAccount = accounts[0];

          provider = new ethers.providers.Web3Provider(window.ethereum);
          signer = provider.getSigner();

          const net = await provider.getNetwork();
          if (net.chainId !== 42220) {
            try {
              await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CELO_MAINNET.chainId }] });
              // re-init after switch
              provider = new ethers.providers.Web3Provider(window.ethereum);
              signer = provider.getSigner();
              showStatus('Switched to Celo. Finalizing connection...', 'info', 5000);
            } catch (switchErr) {
              if (switchErr && switchErr.code === 4902) {
                try {
                  await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [CELO_MAINNET] });
                  showStatus('Celo network added. Please approve switch and click Connect again.', 'info', 7000);
                  return;
                } catch (addErr) {
                  console.error('Add chain failed', addErr);
                  showStatus('Failed to add Celo network.', 'error', 6000);
                  return;
                }
              } else {
                console.error('Switch error', switchErr);
                showStatus('Failed to switch network. Please switch to Celo manually.', 'error', 6000);
                return;
              }
            }
          }

          // Initialize contract
          contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

          // Update UI
          document.getElementById('connectBtn').textContent = `${userAccount.slice(0,6)}...${userAccount.slice(-4)}`;
          document.getElementById('connectBtn').disabled = true;
          document.getElementById('connectBtn').classList.add('opacity-60');
          document.getElementById('userAddress').textContent = `${userAccount.slice(0,6)}...${userAccount.slice(-4)}`;
          document.getElementById('userAddress').classList.remove('hidden');

          showStatus('Connected to Celo Mainnet ✅', 'success', 3000);
        } catch (err) {
          console.error('connectWallet error', err);
          showStatus('Failed to connect wallet: ' + (err.reason || err.message || err), 'error', 7000);
        }
      }

      async function saveProfile(e) {
        e.preventDefault();
        if (!contract) { showStatus('Connect wallet first.', 'error', 3000); return; }
        const name = document.getElementById('profileName').value.trim();
        const bio = document.getElementById('profileBio').value.trim();
        const url = document.getElementById('profileUrl').value.trim();
        const status = document.getElementById('editStatus');
        status.innerHTML = '<p class="text-yellow-300">Submitting transaction...</p>';
        try {
          const tx = await contract.setProfile(name, bio, url);
          status.innerHTML = '<p class="text-blue-300">Waiting for confirmation...</p>';
          await tx.wait();
          status.innerHTML = '<p class="text-green-300">Profile saved successfully ✅</p>';
          setTimeout(() => status.innerHTML = '', 4000);
        } catch (err) {
          console.error('saveProfile error', err);
          status.innerHTML = `<p class="text-red-400">Error: ${err.reason || err.message || err}</p>`;
        }
      }

      async function loadProfile(address) {
        if (!contract) return { exists: false };
        try {
          const res = await contract.getProfile(address);
          return { name: res[0], bio: res[1], portfolioUrl: res[2], exists: res[3] };
        } catch (err) {
          console.error('loadProfile error', err);
          return { exists: false };
        }
      }

      async function displayUserProfile() {
        const disp = document.getElementById('profileDisplay');
        if (!userAccount || !contract) { disp.innerHTML = '<p class="text-yellow-300">Please connect your wallet first.</p>'; return; }
        showStatus('Loading profile...', 'info', 2500);
        const p = await loadProfile(userAccount);
        if (!p.exists) {
          disp.innerHTML = '<p class="text-yellow-300">No profile found. Create one in Edit Profile.</p>';
          return;
        }
        disp.innerHTML = `
          <div class="space-y-4">
            <div><h3 class="text-teal-200 font-semibold">Name</h3><div class="text-white">${p.name}</div></div>
            <div><h3 class="text-teal-200 font-semibold">Bio</h3><div class="text-white">${p.bio}</div></div>
            <div><h3 class="text-teal-200 font-semibold">Portfolio</h3><a href="${p.portfolioUrl}" target="_blank" class="text-teal-300 underline">${p.portfolioUrl}</a></div>
          </div>
        `;
      }

      async function searchProfile() {
        const addr = document.getElementById('searchAddress').value.trim();
        const out = document.getElementById('searchResult');
        out.innerHTML = '';
        if (!addr || !ethers.utils.isAddress(addr)) { out.innerHTML = '<p class="text-red-400">Enter a valid address.</p>'; return; }
        // Read-only provider for search (no need to force connect)
        try {
          const readProvider = new ethers.providers.JsonRpcProvider('https://forno.celo.org');
          const readContract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, readProvider);
          out.innerHTML = '<p class="text-yellow-300">Searching...</p>';
          const res = await readContract.getProfile(addr);
          const p = { name: res[0], bio: res[1], portfolioUrl: res[2], exists: res[3] };
          if (!p.exists) out.innerHTML = '<p class="text-yellow-300">No profile found for this address.</p>';
          else out.innerHTML = `<div class="bg-gray-800 p-4 rounded"><h3 class="text-teal-200 font-semibold">${p.name}</h3><p class="text-gray-300">${p.bio}</p><a class="text-teal-300 underline" href="${p.portfolioUrl}" target="_blank">${p.portfolioUrl}</a></div>`;
        } catch (err) {
          console.error('searchProfile error', err);
          out.innerHTML = '<p class="text-red-400">Failed to load profile.</p>';
        }
      }

      // Bind events
      document.getElementById('btnHome').addEventListener('click', () => showSection('home'));
      document.getElementById('btnEdit').addEventListener('click', () => showSection('edit'));
      document.getElementById('btnView').addEventListener('click', () => showSection('view'));
      document.getElementById('connectBtn').addEventListener('click', connectWallet);
      document.getElementById('profileForm').addEventListener('submit', saveProfile);
      document.getElementById('searchBtn').addEventListener('click', searchProfile);

      // Wallet change handlers
      if (window.ethereum) {
        window.ethereum.on('accountsChanged', (accounts) => {
          if (!accounts || accounts.length === 0) {
            userAccount = null;
            document.getElementById('connectBtn').textContent = 'Connect Wallet';
            document.getElementById('userAddress').classList.add('hidden');
            showStatus('Wallet disconnected', 'info', 2500);
          } else {
            location.reload();
          }
        });
        window.ethereum.on('chainChanged', () => location.reload());
      }

      // Default view
      showSection('home');
    } // end initApp
  </script>
</body>
</html>
